<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Emberfall UI harness</title></head>
<body>
  <div class="gameMenuButton" id="gameMenuButton"><span>55c</span><i>Hero 1</i></div>
  <nav class="gameDock" id="gameDock"><button data-open-game-tab="work"><i>⛏</i>Work</button><button data-open-game-tab="forge"><i>⚒</i>Forge</button><button data-open-game-tab="gear"><i>♜</i>Gear</button><button data-open-game-tab="town"><i>⌂</i>Town</button><button data-open-game-tab="journal"><i>☷</i>Journal</button></nav>
  <div class="gamePanel" id="gamePanel" aria-hidden="true"><div class="gamePanelHead"><div><small>EMBERFALL</small><b id="gamePanelTitle">Work</b></div><button id="gamePanelClose">✕</button></div><div class="gamePanelBody" id="gamePanelBody"></div></div>
  <div class="combatPanel" id="combatPanel" aria-hidden="true"></div>
  <div class="gameToast" id="gameToast"></div>
  <script type="module">
    const source = await fetch('../index.html').then(response => response.text());
    const css = source.match(/<style>([\s\S]*?)<\/style>/)?.[1] || '';
    const style = document.createElement('style');
    style.textContent = css;
    document.head.append(style);
    window.EmberDebug = { log() {} };
    const [{ createFreshState, saveGameState }, { createGameUI }] = await Promise.all([
      import('../game-state.js'),
      import('../game-ui.js')
    ]);
    let state = createFreshState();
    state.coins = 500;
    state.inv.ironBar = 6;
    window.TestState = state;
    window.TestUI = createGameUI({
      getState: () => state,
      commit: () => {
        const result = saveGameState(state);
        state = result.state;
        window.TestState = state;
        return result;
      }
    });
    window.TestReady = true;
  </script>
</body>
</html>
